<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="A cartoon boy with a round yellow head, spiky hair and a wide grin, waving">
  <title>Ralph PHP</title>
  <g stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- arms, one of them waving; outlined by a darker stroke underneath -->
    <g fill="none" stroke-linecap="round">
      <path d="M 82 200 L 54 224" stroke="#1A1A1A" stroke-width="24"/>
      <path d="M 158 200 L 192 162" stroke="#1A1A1A" stroke-width="24"/>
      <path d="M 82 200 L 54 224" stroke="#8EC6EA" stroke-width="16"/>
      <path d="M 158 200 L 192 162" stroke="#8EC6EA" stroke-width="16"/>
    </g>
    <circle cx="200" cy="154" r="14" fill="#FED90F"/>
    <circle cx="48" cy="230" r="14" fill="#FED90F"/>

    <!-- shirt -->
    <path d="M 72 200 C 72 178 92 166 120 166 C 148 166 168 178 168 200 L 168 258 L 72 258 Z" fill="#8EC6EA"/>
    <path d="M 104 168 C 110 180 130 180 136 168" fill="none"/>

    <!-- ears -->
    <circle cx="58" cy="118" r="12" fill="#FED90F"/>
    <circle cx="182" cy="118" r="12" fill="#FED90F"/>

    <!-- head -->
    <ellipse cx="120" cy="110" rx="62" ry="58" fill="#FED90F"/>

    <!-- hair -->
    <path d="M 60 108
             C 56 74 76 50 100 44
             L 96 24 L 116 42 L 124 20 L 140 42 L 158 32 L 156 52
             C 174 62 184 84 180 108
             C 170 84 148 74 120 74
             C 92 74 70 84 60 108 Z" fill="#3A2415"/>

    <!-- eyes -->
    <circle cx="100" cy="104" r="24" fill="#FFFFFF"/>
    <circle cx="142" cy="104" r="24" fill="#FFFFFF"/>
    <circle cx="107" cy="108" r="5.5" fill="#1A1A1A" stroke="none"/>
    <circle cx="136" cy="108" r="5.5" fill="#1A1A1A" stroke="none"/>

    <!-- nose -->
    <path d="M 121 112 C 133 120 131 130 119 130" fill="none"/>

    <!-- grin -->
    <path d="M 88 140 C 96 172 146 172 154 140 Z" fill="#C0392B"/>
    <path d="M 89 143 C 110 150 133 150 153 143 L 151 135 C 132 141 110 141 90 135 Z" fill="#FFFFFF"/>
  </g>
</svg>
